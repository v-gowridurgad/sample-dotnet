name: testing-522
on: workflow_dispatch

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: matherm-aboehm/setup-dotnet@verbose
        with:
          dotnet-version: '8.0.x'
          verbose: true
