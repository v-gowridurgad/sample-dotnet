name: testing-518

on: workflow_dispatch

jobs:
  priya:
    runs-on: ubuntu-latest
    steps:
      - name: Remove dotnet entirely, deny creation in parent
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo chmod a-w /usr/share
          echo "--- precondition ---"
          ls -ld /usr/share
          mkdir /usr/share/dotnet 2>&1 && echo "CAN CREATE" || echo "CANNOT CREATE"
      - name: Setup .NET with an undeterminable home
        id: setup
        continue-on-error: true
        uses: v-priyagupta108/setup-dotnet@install-dir-writable-fallback
        env:
          HOME: /
        with:
          dotnet-version: '8.0.x'

      - name: Result
        if: always()
        run: |
          echo "outcome=${{ steps.setup.outcome }}"
          echo "DOTNET_ROOT=$DOTNET_ROOT"
      - name: Cleanup
        if: always()
        run: sudo chmod u+w /usr/share || true

 
