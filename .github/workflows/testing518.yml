name: home-unset-diff
on: [workflow_dispatch]

jobs:
  home-unset:
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: /tmp/explicit-dotnet
    steps:
      - uses: actions/checkout@v7

      - name: Unset HOME for the action step
        run: |
          echo "HOME=" >> $GITHUB_ENV
          echo "USERPROFILE=" >> $GITHUB_ENV

      - uses: v-mahabaleshwars/setup-dotnet@feature/518-fallback
      # - uses: v-priyagupta108/setup-dotnet@install-dir-writable-fallback
      
        with:
          dotnet-version: '8.0.x'

      - name: Restore HOME and verify
        run: |
          echo "HOME=/home/runner" >> $GITHUB_ENV
          test -x /tmp/explicit-dotnet/dotnet
          /tmp/explicit-dotnet/dotnet --info
