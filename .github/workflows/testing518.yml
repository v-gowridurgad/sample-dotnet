name: testing-518
on: workflow_dispatch

jobs:
  maha-windows-no-programfiles:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unset PROGRAMFILES
        shell: pwsh
        run: echo "PROGRAMFILES=" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: v-mahabaleshwars/setup-dotnet@feature/518-fallback
        with:
          dotnet-version: '8.0.x'
      - name: Did it pollute the repo?
        if: always()
        shell: pwsh
        run: |
          Write-Host "DOTNET_ROOT=$env:DOTNET_ROOT"
          Write-Host "CWD contents:"
          Get-ChildItem . | Select-Object Name
          if (Test-Path ".\dotnet") { throw "SDK installed into the checked-out repo!" }

  priya-windows-no-programfiles:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unset PROGRAMFILES
        shell: pwsh
        run: echo "PROGRAMFILES=" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: v-priyagupta108/setup-dotnet@install-dir-writable-fallback
        with:
          dotnet-version: '8.0.x'
      - name: Did it pollute the repo?
        if: always()
        shell: pwsh
        run: |
          Write-Host "DOTNET_ROOT=$env:DOTNET_ROOT"
          if (Test-Path ".\dotnet") { throw "SDK installed into the checked-out repo!" }
