name: testing-518
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Restrict /usr/share/dotnet and probe it
        run: |
          sudo mkdir -p /usr/share/dotnet
          sudo chmod a-w /usr/share/dotnet
          echo "--- permissions ---"
          ls -ld /usr/share/dotnet
          getfacl /usr/share/dotnet 2>/dev/null || echo "(no acl tooling)"
          id
          echo "--- probe (same as both PRs use) ---"
          if mktemp -d /usr/share/dotnet/.probe-XXXXXX 2>&1; then
            echo "RESULT: WRITABLE"
          else
            echo "RESULT: NOT WRITABLE"
          fi
          rm -rf /usr/share/dotnet/.probe-* 2>/dev/null || true
