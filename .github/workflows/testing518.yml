name: fallback-single-scenario
on: workflow_dispatch

jobs:
  symlinked-default-not-writable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Replace default install dir with a symlink to a read-only target
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo mkdir -p /opt/readonly-dotnet
          sudo chmod a-w /opt/readonly-dotnet
          sudo ln -s /opt/readonly-dotnet /usr/share/dotnet
          ls -la /usr/share/dotnet

      # - uses: v-priyagupta108/setup-dotnet@install-dir-writable-fallback
      - uses: v-mahabaleshwars/setup-dotnet@feature/518-fallback
       
        with:
          dotnet-version: '8.0.x'

      - name: Verify fallback landed under $HOME/.dotnet
        run: |
          test -x "$HOME/.dotnet/dotnet" || { echo "no fallback"; exit 1; }
          "$HOME/.dotnet/dotnet" --info
