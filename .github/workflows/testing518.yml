name: issue-518

on: workflow_dispatch

jobs:
  main-v6:
    runs-on: ubuntu-latest
    steps:
      - name: Remove dotnet entirely, deny creation in parent
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo chmod a-w /usr/share
          echo "--- state ---"
          ls -ld /usr/share
          mkdir /usr/share/dotnet 2>&1 && echo "CAN CREATE" || echo "CANNOT CREATE"

      - name: Setup .NET
        id: setup
        continue-on-error: true
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Result
        if: always()
        run: |
          echo "outcome=${{ steps.setup.outcome }}"
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          which dotnet 2>/dev/null || echo "dotnet not on PATH"

      - name: Cleanup
        if: always()
        run: sudo chmod u+w /usr/share || true

