name: testing-518
on: workflow_dispatch

jobs:
  maha:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/runtime-deps:8.0
      options: --user 1001:1001
    env:
      HOME: /
    steps:
      - name: Make the default unwritable
        run: |
          mkdir -p /usr/share/dotnet 2>/dev/null || true
          chmod a-w /usr/share/dotnet 2>/dev/null || true
          echo "HOME=$HOME"
          node -e "console.log('homedir:', require('os').homedir())"
      - uses: v-mahabaleshwars/setup-dotnet@feature/518-fallback
        with:
          dotnet-version: '8.0.x'
      - name: Where did it target?
        if: always()
        run: |
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          ls -la /.dotnet 2>/dev/null && echo "TARGETED /.dotnet" || echo "did not target root"

  priya:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/runtime-deps:8.0
      options: --user 1001:1001
    env:
      HOME: /
    steps:
      - name: Make the default unwritable
        run: |
          mkdir -p /usr/share/dotnet 2>/dev/null || true
          chmod a-w /usr/share/dotnet 2>/dev/null || true
      - uses: v-priyagupta108/setup-dotnet@install-dir-writable-fallback
        with:
          dotnet-version: '8.0.x'
      - name: Where did it target?
        if: always()
        run: |
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          ls -la /.dotnet 2>/dev/null && echo "TARGETED /.dotnet" || echo "did not target root"
